<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>清掃出勤管理 - 管理者ページ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #F5F0E5;
    --surface: #FFFFFF;
    --border: #E8DDC8;
    --field: #F8F3E8;
    --ink: #3A342E;
    --muted: #6B7A8D;
    --brown: #7c5d48;
    --coral: #F7877C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    padding: 20px 16px 60px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; color: var(--brown); margin: 32px 0 10px; }
  .sub { font-size: 12px; color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row + .row { margin-top: 10px; padding-top: 10px; border-top: 1px solid #F3EFE4; }
  .name { font-weight: 700; font-size: 14px; }
  .meta { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .btn {
    border: none;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--brown); color: #fff; }
  .btn-danger { background: transparent; color: var(--coral); }
  .btn-small { padding: 6px 10px; font-size: 12px; }
  .form-card {
    background: var(--field);
    border-radius: 14px;
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 16px;
  }
  input, select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    background: #fff;
    flex: 1;
    min-width: 110px;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 0; }
  .month-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .month-row button { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #F3EFE4; }
  th { color: var(--muted); font-weight: 600; font-size: 11px; }
  .flag { color: var(--coral); font-weight: 700; }
  .copybtn { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
</style>
</head>
<body>

<div id="passwordGate" style="max-width: 320px; margin: 80px auto; text-align: center;">
  <p style="font-weight: 700; margin-bottom: 14px;">合言葉を入力してください</p>
  <input id="passwordInput" type="password" style="width: 100%; margin-bottom: 10px;" />
  <button class="btn btn-primary" style="width: 100%;" onclick="checkPassword()">開く</button>
  <p id="passwordError" style="color: #F7877C; font-size: 13px; margin-top: 10px; display: none;">合言葉が違います</p>
</div>

<div id="mainContent" style="display: none;">

<h1>清掃出勤管理</h1>
<p class="sub">管理者ページ — 従業員・清掃場所・担当の登録、出勤状況の確認</p>

<h2>従業員</h2>
<div class="form-card">
  <input id="newEmployeeCode" placeholder="コード番号(ファイルメーカー)" style="flex: 0 0 160px;" />
  <input id="newEmployeeName" placeholder="氏名(例: 山田 太郎)" />
  <button class="btn btn-primary" onclick="addEmployee()">追加</button>
</div>
<details style="margin-bottom: 16px;">
  <summary style="cursor:pointer; color: var(--brown); font-size: 13px;">まとめて登録(CSV貼り付け)</summary>
  <div class="form-card" style="margin-top: 8px; flex-direction: column; align-items: stretch;">
    <textarea id="employeeCsv" rows="6" placeholder="コード,氏名&#10;E001,山田太郎&#10;E002,鈴木花子" style="width:100%; font-family: monospace; font-size: 13px;"></textarea>
    <button class="btn btn-primary" style="margin-top: 8px;" onclick="importEmployeesCsv()">この内容で一括登録</button>
    <div id="employeeImportResult" class="meta"></div>
  </div>
</details>
<div id="employeeList"></div>

<h2>清掃場所</h2>
<div class="form-card">
  <input id="newLocationCode" placeholder="コード番号(ファイルメーカー)" style="flex: 0 0 160px;" />
  <input id="newLocationName" placeholder="場所名(例: 〇〇ビル)" />
  <button class="btn btn-primary" onclick="addLocation()">追加</button>
</div>
<details style="margin-bottom: 16px;">
  <summary style="cursor:pointer; color: var(--brown); font-size: 13px;">まとめて登録(CSV貼り付け)</summary>
  <div class="form-card" style="margin-top: 8px; flex-direction: column; align-items: stretch;">
    <textarea id="locationCsv" rows="6" placeholder="コード,場所名&#10;L012,〇〇ビル&#10;L013,△△マンション" style="width:100%; font-family: monospace; font-size: 13px;"></textarea>
    <button class="btn btn-primary" style="margin-top: 8px;" onclick="importLocationsCsv()">この内容で一括登録</button>
    <div id="locationImportResult" class="meta"></div>
  </div>
</details>
<div id="locationList"></div>

<h2>清掃場所のスケジュール(曜日ごとの時間)</h2>
<div class="form-card">
  <select id="scheduleLocation"></select>
  <select id="scheduleDay" style="flex: 0 0 80px;">
    <option value="1">月</option>
    <option value="2">火</option>
    <option value="3">水</option>
    <option value="4">木</option>
    <option value="5">金</option>
    <option value="6">土</option>
    <option value="0">日</option>
  </select>
  <input id="scheduleStartTime" type="time" style="flex: 0 0 110px;" />
  <input id="scheduleHours" type="number" step="0.1" placeholder="清掃時間(例: 1.5)" />
  <button class="btn btn-primary" onclick="addSchedule()">追加</button>
</div>
<details style="margin-bottom: 16px;">
  <summary style="cursor:pointer; color: var(--brown); font-size: 13px;">まとめて登録(CSV貼り付け)</summary>
  <div class="form-card" style="margin-top: 8px; flex-direction: column; align-items: stretch;">
    <textarea id="scheduleCsv" rows="6" placeholder="場所コード,曜日,開始時刻,清掃時間&#10;L012,月,07:30,1.5&#10;L012,水,07:30,1.0" style="width:100%; font-family: monospace; font-size: 13px;"></textarea>
    <p class="meta">曜日は 月火水木金土日 の1文字で入力してください</p>
    <button class="btn btn-primary" style="margin-top: 8px;" onclick="importSchedulesCsv()">この内容で一括登録</button>
    <div id="scheduleImportResult" class="meta"></div>
  </div>
</details>
<div id="scheduleList"></div>

<h2>担当(従業員 × スケジュール)</h2>
<div class="form-card">
  <select id="assignEmployee"></select>
  <select id="assignScheduleLocation" onchange="updateAssignScheduleOptions()"></select>
  <select id="assignSchedule"></select>
  <button class="btn btn-primary" onclick="addAssignment()">追加</button>
</div>
<details style="margin-bottom: 16px;">
  <summary style="cursor:pointer; color: var(--brown); font-size: 13px;">まとめて登録(CSV貼り付け)</summary>
  <div class="form-card" style="margin-top: 8px; flex-direction: column; align-items: stretch;">
    <textarea id="assignmentCsv" rows="6" placeholder="従業員コード,場所コード,曜日,開始時刻&#10;E001,L012,月,07:30" style="width:100%; font-family: monospace; font-size: 13px;"></textarea>
    <p class="meta">「場所コード,曜日,開始時刻」が、上で登録済みのスケジュールと一致する必要があります</p>
    <button class="btn btn-primary" style="margin-top: 8px;" onclick="importAssignmentsCsv()">この内容で一括登録</button>
    <div id="assignmentImportResult" class="meta"></div>
  </div>
</details>
<div id="assignmentList"></div>

<h2>今月の集計</h2>
<div class="month-row">
  <button onclick="changeMonth(-1)">‹ 前月</button>
  <strong id="monthLabel"></strong>
  <button onclick="changeMonth(1)">翌月 ›</button>
</div>
<div class="card" id="summaryCard">
  <table>
    <thead>
      <tr><th>コード</th><th>従業員</th><th>出勤日数</th><th>合計時間</th><th>備考</th></tr>
    </thead>
    <tbody id="summaryBody"></tbody>
  </table>
</div>

</div>

<script src="supabase-config.js"></script>
<script>
let employees = [];
let locations = [];
let schedules = [];
let assignments = [];
let viewMonth = new Date();
viewMonth.setDate(1);

const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

const ADMIN_PASSWORD_HASH = '850ad2afc34dc9275acda04522038e0bdbefdaec9ac36a2c56a6301ad82234dc';

async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(digest)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

async function checkPassword() {
  const input = document.getElementById('passwordInput').value;
  const hash = await sha256Hex(input);
  if (hash === ADMIN_PASSWORD_HASH) {
    localStorage.setItem('seisou_admin_ok', '1');
    unlock();
  } else {
    document.getElementById('passwordError').style.display = 'block';
  }
}

function unlock() {
  document.getElementById('passwordGate').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  loadAll();
}

document.getElementById('passwordInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkPassword();
});

if (localStorage.getItem('seisou_admin_ok') === '1') {
  unlock();
}

function addHours(startTime, hours) {
  const [h, m] = startTime.split(':').map(Number);
  const totalMin = h * 60 + m + Math.round(hours * 60);
  const endH = Math.floor((totalMin % 1440) / 60);
  const endM = totalMin % 60;
  return String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0');
}

function parseCsvLines(text) {
  const rows = text.split('\n').map((l) => l.trim()).filter((l) => l.length > 0).map((l) => l.split(',').map((c) => c.trim()));
  if (rows.length && /コード|code/i.test(rows[0][0] || '')) rows.shift();
  return rows;
}

function slugify() {
  return Math.random().toString(36).slice(2, 8) + Math.random().toString(36).slice(2, 6);
}

function personalLink(slug) {
  return window.location.href.replace(/admin\.html.*$/, 'index.html') + '?e=' + slug;
}

async function loadAll() {
  const [e, l, s, a] = await Promise.all([
    sb.from('employees').select('*').order('name'),
    sb.from('locations').select('*').order('name'),
    sb.from('location_schedules').select('*, locations(name)'),
    sb.from('assignments').select('*, employees(name), location_schedules(day_of_week, start_time, standard_hours, location_id, locations(name))'),
  ]);
  employees = e.data || [];
  locations = l.data || [];
  schedules = s.data || [];
  assignments = a.data || [];
  renderEmployees();
  renderLocations();
  renderScheduleForm();
  renderSchedules();
  renderAssignmentForm();
  renderAssignments();
  renderSummary();
}

function renderEmployees() {
  const el = document.getElementById('employeeList');
  if (employees.length === 0) { el.innerHTML = '<p class="empty">まだ従業員が登録されていません</p>'; return; }
  el.innerHTML = '<div class="card">' + employees.map((emp, i) => `
    <div class="row" ${i > 0 ? '' : ''}>
      <div>
        <div class="name">${emp.name} <span style="color:var(--muted); font-weight:400;">${emp.code ? '(コード: ' + emp.code + ')' : '(コード未設定)'}</span></div>
        <div class="meta">${personalLink(emp.slug)}</div>
      </div>
      <div style="display:flex; gap:6px;">
        <button class="copybtn" onclick="editEmployeeCode('${emp.id}', '${emp.code ?? ''}')">コード編集</button>
        <button class="copybtn" onclick="copyLink('${emp.slug}')">リンクをコピー</button>
        <button class="btn btn-danger btn-small" onclick="deleteEmployee('${emp.id}')">削除</button>
      </div>
    </div>
  `).join('') + '</div>';
}

function renderLocations() {
  const el = document.getElementById('locationList');
  if (locations.length === 0) { el.innerHTML = '<p class="empty">まだ清掃場所が登録されていません</p>'; return; }
  el.innerHTML = '<div class="card">' + locations.map((loc) => `
    <div class="row">
      <div class="name">${loc.name} <span style="color:var(--muted); font-weight:400;">${loc.code ? '(コード: ' + loc.code + ')' : '(コード未設定)'}</span></div>
      <div style="display:flex; gap:6px;">
        <button class="copybtn" onclick="editLocationCode('${loc.id}', '${loc.code ?? ''}')">コード編集</button>
        <button class="btn btn-danger btn-small" onclick="deleteLocation('${loc.id}')">削除</button>
      </div>
    </div>
  `).join('') + '</div>';
}

function renderScheduleForm() {
  document.getElementById('scheduleLocation').innerHTML = locations.map((l) => `<option value="${l.id}">${l.name}</option>`).join('');
}

function renderSchedules() {
  const el = document.getElementById('scheduleList');
  if (schedules.length === 0) { el.innerHTML = '<p class="empty">まだスケジュールが登録されていません</p>'; return; }
  const byLocation = new Map();
  for (const s of schedules) {
    const key = s.location_id;
    if (!byLocation.has(key)) byLocation.set(key, { name: s.locations?.name ?? '?', items: [] });
    byLocation.get(key).items.push(s);
  }
  el.innerHTML = Array.from(byLocation.values()).map((loc) => `
    <div class="card">
      <div class="name" style="margin-bottom: 8px;">${loc.name}</div>
      ${loc.items
        .sort((a, b) => a.day_of_week - b.day_of_week || a.start_time.localeCompare(b.start_time))
        .map((s, i) => `
          <div class="row" ${i > 0 ? 'style="margin-top:8px; padding-top:8px; border-top:1px solid #F3EFE4;"' : ''}>
            <div>${WEEKDAY_LABELS[s.day_of_week]}曜 ${s.start_time}〜${addHours(s.start_time, s.standard_hours)}(${s.standard_hours}時間)</div>
            <button class="btn btn-danger btn-small" onclick="deleteSchedule('${s.id}')">削除</button>
          </div>
        `).join('')}
    </div>
  `).join('');
}

async function addSchedule() {
  const location_id = document.getElementById('scheduleLocation').value;
  const day_of_week = parseInt(document.getElementById('scheduleDay').value, 10);
  const start_time = document.getElementById('scheduleStartTime').value;
  const standard_hours = parseFloat(document.getElementById('scheduleHours').value);
  if (!location_id || !start_time || !standard_hours) { alert('場所・開始時刻・清掃時間を入力してください'); return; }
  await sb.from('location_schedules').insert({ location_id, day_of_week, start_time, standard_hours });
  document.getElementById('scheduleStartTime').value = '';
  document.getElementById('scheduleHours').value = '';
  loadAll();
}

async function importSchedulesCsv() {
  const rows = parseCsvLines(document.getElementById('scheduleCsv').value);
  const locByCode = new Map(locations.filter((l) => l.code).map((l) => [l.code, l.id]));
  let added = 0;
  const errors = [];
  for (const [locCode, dayStr, startTime, hoursStr] of rows) {
    if (!locCode) continue;
    const location_id = locByCode.get(locCode);
    const day_of_week = WEEKDAY_LABELS.indexOf(dayStr);
    const standard_hours = parseFloat(hoursStr);
    if (!location_id || day_of_week < 0 || !startTime || !standard_hours) {
      errors.push(`${locCode},${dayStr}: 内容を確認してください(場所コード・曜日・時刻・時間)`);
      continue;
    }
    await sb.from('location_schedules').insert({ location_id, day_of_week, start_time: startTime, standard_hours });
    added++;
  }
  document.getElementById('scheduleImportResult').innerHTML = `${added}件登録` + (errors.length ? `<br>確認が必要: ${errors.length}件<br>${errors.join('<br>')}` : '');
  document.getElementById('scheduleCsv').value = '';
  loadAll();
}

async function deleteSchedule(id) {
  if (!confirm('このスケジュールを削除しますか?(関連する担当も削除されます)')) return;
  await sb.from('location_schedules').delete().eq('id', id);
  loadAll();
}

function renderAssignmentForm() {
  document.getElementById('assignEmployee').innerHTML = employees.map((e) => `<option value="${e.id}">${e.name}</option>`).join('');
  document.getElementById('assignScheduleLocation').innerHTML = locations.map((l) => `<option value="${l.id}">${l.name}</option>`).join('');
  updateAssignScheduleOptions();
}

function updateAssignScheduleOptions() {
  const locId = document.getElementById('assignScheduleLocation').value;
  const opts = schedules
    .filter((s) => s.location_id === locId)
    .sort((a, b) => a.day_of_week - b.day_of_week || a.start_time.localeCompare(b.start_time))
    .map((s) => `<option value="${s.id}">${WEEKDAY_LABELS[s.day_of_week]}曜 ${s.start_time}〜${addHours(s.start_time, s.standard_hours)}</option>`);
  document.getElementById('assignSchedule').innerHTML = opts.length ? opts.join('') : '<option value="">(この場所のスケジュール未登録)</option>';
}

function renderAssignments() {
  const el = document.getElementById('assignmentList');
  if (assignments.length === 0) { el.innerHTML = '<p class="empty">まだ担当が登録されていません</p>'; return; }
  el.innerHTML = '<div class="card">' + assignments.map((a) => {
    const s = a.location_schedules;
    const label = s
      ? `${s.locations?.name ?? '?'}(${WEEKDAY_LABELS[s.day_of_week]}曜 ${s.start_time}〜${addHours(s.start_time, s.standard_hours)})`
      : '(スケジュール不明)';
    return `
    <div class="row">
      <div class="name">${a.employees?.name ?? '?'} × ${label}</div>
      <button class="btn btn-danger btn-small" onclick="deleteAssignment('${a.id}')">削除</button>
    </div>
  `;
  }).join('') + '</div>';
}

async function addEmployee() {
  const name = document.getElementById('newEmployeeName').value.trim();
  const code = document.getElementById('newEmployeeCode').value.trim();
  if (!name) return;
  await sb.from('employees').insert({ name, code: code || null, slug: slugify() });
  document.getElementById('newEmployeeName').value = '';
  document.getElementById('newEmployeeCode').value = '';
  loadAll();
}

async function importEmployeesCsv() {
  const rows = parseCsvLines(document.getElementById('employeeCsv').value);
  const existingCodes = new Set(employees.map((e) => e.code).filter(Boolean));
  let added = 0, skipped = 0;
  for (const [code, name] of rows) {
    if (!code || !name) continue;
    if (existingCodes.has(code)) { skipped++; continue; }
    await sb.from('employees').insert({ code, name, slug: slugify() });
    existingCodes.add(code);
    added++;
  }
  document.getElementById('employeeImportResult').textContent = `${added}件登録、${skipped}件スキップ(既存コード)`;
  document.getElementById('employeeCsv').value = '';
  loadAll();
}

async function editEmployeeCode(id, current) {
  const code = prompt('コード番号を入力してください', current);
  if (code === null) return;
  await sb.from('employees').update({ code: code.trim() || null }).eq('id', id);
  loadAll();
}

async function deleteEmployee(id) {
  if (!confirm('この従業員を削除しますか?(担当・出勤記録も削除されます)')) return;
  await sb.from('employees').delete().eq('id', id);
  loadAll();
}

async function addLocation() {
  const name = document.getElementById('newLocationName').value.trim();
  const code = document.getElementById('newLocationCode').value.trim();
  if (!name) return;
  await sb.from('locations').insert({ name, code: code || null });
  document.getElementById('newLocationName').value = '';
  document.getElementById('newLocationCode').value = '';
  loadAll();
}

async function importLocationsCsv() {
  const rows = parseCsvLines(document.getElementById('locationCsv').value);
  const existingCodes = new Set(locations.map((l) => l.code).filter(Boolean));
  let added = 0, skipped = 0;
  for (const [code, name] of rows) {
    if (!code || !name) continue;
    if (existingCodes.has(code)) { skipped++; continue; }
    await sb.from('locations').insert({ code, name });
    existingCodes.add(code);
    added++;
  }
  document.getElementById('locationImportResult').textContent = `${added}件登録、${skipped}件スキップ(既存コード)`;
  document.getElementById('locationCsv').value = '';
  loadAll();
}

async function editLocationCode(id, current) {
  const code = prompt('コード番号を入力してください', current);
  if (code === null) return;
  await sb.from('locations').update({ code: code.trim() || null }).eq('id', id);
  loadAll();
}

async function deleteLocation(id) {
  if (!confirm('この清掃場所を削除しますか?(担当・出勤記録も削除されます)')) return;
  await sb.from('locations').delete().eq('id', id);
  loadAll();
}

async function addAssignment() {
  const employee_id = document.getElementById('assignEmployee').value;
  const schedule_id = document.getElementById('assignSchedule').value;
  if (!employee_id || !schedule_id) { alert('従業員とスケジュールを選択してください'); return; }
  await sb.from('assignments').insert({ employee_id, schedule_id });
  loadAll();
}

async function importAssignmentsCsv() {
  const rows = parseCsvLines(document.getElementById('assignmentCsv').value);
  const empByCode = new Map(employees.filter((e) => e.code).map((e) => [e.code, e.id]));
  const locByCode = new Map(locations.filter((l) => l.code).map((l) => [l.code, l.id]));
  const existingPairs = new Set(assignments.map((a) => a.employee_id + '|' + a.schedule_id));
  let added = 0;
  const errors = [];
  for (const [empCode, locCode, dayStr, startTime] of rows) {
    if (!empCode || !locCode) continue;
    const employee_id = empByCode.get(empCode);
    const location_id = locByCode.get(locCode);
    const day_of_week = WEEKDAY_LABELS.indexOf(dayStr);
    const schedule = schedules.find((s) => s.location_id === location_id && s.day_of_week === day_of_week && s.start_time === startTime);
    if (!employee_id || !schedule) {
      errors.push(`${empCode},${locCode},${dayStr},${startTime}: 該当する従業員またはスケジュールが見つかりません`);
      continue;
    }
    if (existingPairs.has(employee_id + '|' + schedule.id)) continue;
    await sb.from('assignments').insert({ employee_id, schedule_id: schedule.id });
    existingPairs.add(employee_id + '|' + schedule.id);
    added++;
  }
  document.getElementById('assignmentImportResult').innerHTML = `${added}件登録` + (errors.length ? `<br>確認が必要: ${errors.length}件<br>${errors.join('<br>')}` : '');
  document.getElementById('assignmentCsv').value = '';
  loadAll();
}

async function deleteAssignment(id) {
  if (!confirm('この担当を削除しますか?')) return;
  await sb.from('assignments').delete().eq('id', id);
  loadAll();
}

function copyLink(slug) {
  const link = personalLink(slug);
  navigator.clipboard.writeText(link).then(() => alert('リンクをコピーしました')).catch(() => prompt('コピーしてください', link));
}

function monthRange(d) {
  const start = new Date(d.getFullYear(), d.getMonth(), 1);
  const end = new Date(d.getFullYear(), d.getMonth() + 1, 1);
  const fmt = (x) => x.toISOString().slice(0, 10);
  return { start: fmt(start), end: fmt(end) };
}

function changeMonth(delta) {
  viewMonth.setMonth(viewMonth.getMonth() + delta);
  renderSummary();
}

async function renderSummary() {
  document.getElementById('monthLabel').textContent = viewMonth.getFullYear() + '年' + (viewMonth.getMonth() + 1) + '月';
  const { start, end } = monthRange(viewMonth);
  const { data: records, error } = await sb
    .from('attendance_records')
    .select('*, employees(name, code), locations(name)')
    .gte('date', start)
    .lt('date', end);

  if (error) {
    document.getElementById('summaryBody').innerHTML = `<tr><td colspan="5" class="empty">読み込みエラー: ${error.message}</td></tr>`;
    return;
  }

  const byEmployee = new Map();
  for (const r of records || []) {
    const key = r.employee_id;
    if (!byEmployee.has(key)) byEmployee.set(key, { name: r.employees?.name ?? '?', code: r.employees?.code ?? '', days: 0, hours: 0, notes: [] });
    const entry = byEmployee.get(key);
    entry.days += 1;
    entry.hours += Number(r.hours);
    if (!r.is_standard) {
      const timeInfo = r.actual_start_time && r.actual_end_time ? `${r.actual_start_time}〜${r.actual_end_time}` : `${r.hours}h`;
      entry.notes.push(`${r.date}(${r.locations?.name ?? ''}): ${timeInfo} — ${r.reason ?? ''}`);
    }
  }

  const tbody = document.getElementById('summaryBody');
  if (byEmployee.size === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty">この月の記録はまだありません</td></tr>';
    return;
  }
  tbody.innerHTML = Array.from(byEmployee.values()).map((e) => `
    <tr>
      <td>${e.code || '-'}</td>
      <td>${e.name}</td>
      <td>${e.days}日</td>
      <td>${e.hours.toFixed(1)}時間</td>
      <td>${e.notes.length ? `<span class="flag">${e.notes.length}件</span><br>${e.notes.join('<br>')}` : '-'}</td>
    </tr>
  `).join('');
}
</script>
