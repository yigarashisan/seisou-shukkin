<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>清掃出勤管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #F5F0E5;
    --surface: #FFFFFF;
    --border: #E8DDC8;
    --field: #F8F3E8;
    --ink: #3A342E;
    --muted: #6B7A8D;
    --brown: #7c5d48;
    --pink: #F0A8C4;
    --coral: #F7877C;
    --dusty-blue: #6C8CAE;
    --dusty-red: #B5726B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    padding: 24px 18px 50px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 18px; text-align: center; margin: 0 0 4px; color: var(--muted); }
  .hello { font-size: 22px; font-weight: 700; text-align: center; margin: 0 0 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .locName { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .locHours { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .bigbtn {
    display: block;
    width: 100%;
    background: var(--pink);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 20px;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
  }
  .bigbtn:active { opacity: 0.85; }
  .locChoice {
    display: block;
    width: 100%;
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    cursor: pointer;
    text-align: left;
  }
  .linklike {
    display: block;
    text-align: center;
    color: var(--brown);
    font-size: 13px;
    margin-top: 14px;
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
  }
  .correctForm { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .correctForm label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .correctForm input, .correctForm textarea, .correctForm select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    margin-bottom: 10px;
    background: var(--field);
    font-family: inherit;
  }
  .reimbTotal { text-align: right; font-size: 13px; color: var(--muted); margin: 10px 0 2px; }
  .reimbTotal strong { color: var(--ink); }
  .reimbDone { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .reimbDone button { border: none; background: none; color: var(--brown); font-size: 12px; text-decoration: underline; cursor: pointer; margin-left: 6px; }
  .doneIcon { font-size: 48px; text-align: center; margin-bottom: 8px; }
  .doneMsg { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .doneSub { text-align: center; font-size: 13px; color: var(--muted); }
  .sectionTitle { font-size: 12px; color: var(--muted); font-weight: 600; margin: 24px 0 8px; }
  .histRow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #F3EFE4; font-size: 13px;
  }
  .histRow:last-child { border-bottom: none; }
  .histDate { color: var(--ink); font-weight: 600; }
  .histDetail { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .histActions button {
    border: none; background: none; font-size: 12px; color: var(--brown); cursor: pointer; margin-left: 8px;
  }
  .errorBox { text-align: center; color: var(--muted); padding: 40px 20px; }
  .calWrap {
    margin-bottom: 20px; background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 18px; padding: 16px 14px;
  }
  .calNav { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-bottom: 10px; }
  .calTitle { text-align: center; font-size: 13px; color: var(--muted); font-weight: 600; flex: 1; }
  .calNavBtn {
    flex: 0 0 auto; background: var(--field); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 10px; font-size: 12px; color: var(--brown); cursor: pointer; font-family: inherit;
  }
  .calNavBtn:disabled { color: var(--border); cursor: default; }
  .calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .calHead { margin-bottom: 5px; }
  .calHeadCell { text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); }
  .calHeadCell.calSun { color: var(--dusty-red); }
  .calHeadCell.calSat { color: var(--dusty-blue); }
  .calCell {
    aspect-ratio: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; border: 1.5px solid var(--border); background: var(--field); font-size: 13px; color: var(--ink);
    position: relative; padding: 0; font-family: inherit;
  }
  .calCell.calEmpty { background: transparent; border-color: transparent; }
  .calCell.calDisabled { background: var(--surface); }
  .calCell.calDisabled .calNum { color: var(--muted); }
  .calCell.calDisabled .calNum.calNumSun { color: var(--dusty-red); }
  .calCell.calDisabled .calNum.calNumSat { color: var(--dusty-blue); }
  .calCell.calToday:not(.calSelected) { box-shadow: inset 0 0 0 2px var(--brown); border-color: var(--brown); }
  .calCell.calSelected { background: var(--brown); border-color: var(--brown); color: #fff; }
  .calNum { font-size: 19px; font-weight: 700; }
  .calNum.calNumSun { color: var(--dusty-red); }
  .calNum.calNumSat { color: var(--dusty-blue); }
  .calCell.calSelected .calNum { color: #fff; }
  .calCheck { font-size: 11px; line-height: 1; color: var(--coral); margin-top: 3px; font-weight: 700; }
  .calCell.calSelected .calCheck { color: #fff; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="errorBox">読み込み中...</p>
</div>

<script src="supabase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get('e');
const app = document.getElementById('app');

let employee = null;
let myAssignments = [];
let selectedAssignment = null;
let recent = [];
let periodStart = null;
let periodEnd = null;
let periodDates = new Set();
let selectedDate = null;
let viewPeriodBase = new Date();
let holidaySet = new Set();
const holidayCache = new Map();
let reimbursements = [];
let periodConfirmation = null;

const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

function addHours(startTime, hours) {
  const [h, m] = startTime.split(':').map(Number);
  const totalMin = h * 60 + m + Math.round(hours * 60);
  const endH = Math.floor((totalMin % 1440) / 60);
  const endM = totalMin % 60;
  return String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0');
}

function computeEndTime(startTime, hours, breakMinutes) {
  return addHours(startTime, hours + (breakMinutes || 0) / 60);
}

function timeRangeLabel(a) {
  if (!a.start_time) return `通常: ${a.standard_hours}時間`;
  const range = `${a.start_time}〜${computeEndTime(a.start_time, a.standard_hours, a.break_minutes)}`;
  return a.break_minutes ? `${range}(休憩${a.break_minutes}分)` : range;
}

function diffHours(startTime, endTime) {
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  let diffMin = (eh * 60 + em) - (sh * 60 + sm);
  if (diffMin < 0) diffMin += 1440;
  return diffMin / 60;
}

function recordDetailLabel(r, asg) {
  if (r.is_standard) return asg ? timeRangeLabel(asg) : `${r.hours}時間`;
  if (r.actual_start_time && r.actual_end_time) {
    const breakInfo = r.actual_break_minutes ? `、休憩${r.actual_break_minutes}分` : '';
    return `${r.actual_start_time}〜${r.actual_end_time}${breakInfo}(通常と違う: ${r.reason ?? ''})`;
  }
  return `${r.hours}時間(通常と違う: ${r.reason ?? ''})`;
}

function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function todayStr() {
  return dateStr(new Date());
}

function dowOf(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

function dateLabel(ds) {
  const [, m, d] = ds.split('-').map(Number);
  return `${m}月${d}日(${WEEKDAY_LABELS[dowOf(ds)]})`;
}

// 20日締めの給与期間(21日〜翌月20日)。今日がその中のどこにいても
// 正しい期間を計算できるよう、日付からではなく基準日から算出する
function payPeriodRange(base) {
  const y = base.getFullYear(), m = base.getMonth(), d = base.getDate();
  if (d >= 21) return { start: new Date(y, m, 21), end: new Date(y, m + 1, 20) };
  return { start: new Date(y, m - 1, 21), end: new Date(y, m, 20) };
}

// 令和は2019年が元年。この数字計算は令和の期間(2019年5月以降)のみを想定している
function reiwaYear(y) {
  return y - 2018;
}

function wareki(d) {
  return `令和${reiwaYear(d.getFullYear())}年${d.getMonth() + 1}月${d.getDate()}日`;
}

function formatPeriodLabel() {
  return `${wareki(periodStart)} 〜 ${wareki(periodEnd)}`;
}

function isCurrentPeriod() {
  return periodStart.getTime() === payPeriodRange(new Date()).start.getTime();
}

function setPeriodFromBase() {
  const range = payPeriodRange(viewPeriodBase);
  periodStart = range.start;
  periodEnd = range.end;
}

async function loadPeriodData() {
  await Promise.all([loadRecent(), loadPeriodDates(), loadHolidaySet(), loadReimbursements(), loadPeriodConfirmation()]);
}

async function changePeriod(delta) {
  const actual = payPeriodRange(new Date());
  const next = new Date(viewPeriodBase);
  next.setMonth(next.getMonth() + delta);
  const nextRange = payPeriodRange(next);
  if (nextRange.start > actual.start) return;
  viewPeriodBase = next;
  setPeriodFromBase();
  const today = new Date();
  selectedDate = (periodStart <= today && today <= periodEnd) ? todayStr() : dateStr(periodEnd);
  await loadPeriodData();
  renderMain();
}

function buildCalendarDays() {
  const days = [];
  for (let i = 0; i < periodStart.getDay(); i++) days.push(null);
  const cur = new Date(periodStart);
  while (cur <= periodEnd) {
    days.push(new Date(cur));
    cur.setDate(cur.getDate() + 1);
  }
  while (days.length % 7 !== 0) days.push(null);
  return days;
}

// 日本の祝日一覧を年ごとに取得してキャッシュする(カレンダーの色分け表示用)。
// 取得できなくても通常の予定なし表示になるだけなので、エラーは握りつぶす
async function getHolidaySet(year) {
  if (holidayCache.has(year)) return holidayCache.get(year);
  let set = new Set();
  try {
    const res = await fetch(`https://holidays-jp.github.io/api/v1/${year}/date.json`);
    const data = await res.json();
    set = new Set(Object.keys(data));
  } catch (e) {
    console.error('祝日データの取得に失敗しました', e);
  }
  holidayCache.set(year, set);
  return set;
}

async function loadHolidaySet() {
  const [a, b] = await Promise.all([
    getHolidaySet(periodStart.getFullYear()),
    getHolidaySet(periodEnd.getFullYear()),
  ]);
  holidaySet = new Set([...a, ...b]);
}

async function loadPeriodDates() {
  const { data } = await sb
    .from('attendance_records')
    .select('date')
    .eq('employee_id', employee.id)
    .gte('date', dateStr(periodStart))
    .lte('date', dateStr(periodEnd));
  periodDates = new Set((data || []).map((r) => r.date));
}

function renderCalendarHtml() {
  const todayS = todayStr();
  const cells = buildCalendarDays().map((d) => {
    if (!d) return '<div class="calCell calEmpty"></div>';
    const ds = dateStr(d);
    const isFuture = ds > todayS;
    const dow = d.getDay();
    const isHoliday = holidaySet.has(ds);
    const cls = ['calCell'];
    if (isFuture) cls.push('calDisabled');
    if (ds === todayS) cls.push('calToday');
    if (ds === selectedDate) cls.push('calSelected');
    const numCls = ['calNum'];
    if (isHoliday || dow === 0) numCls.push('calNumSun');
    else if (dow === 6) numCls.push('calNumSat');
    if (isFuture) return `<div class="${cls.join(' ')}"><span class="${numCls.join(' ')}">${d.getDate()}</span></div>`;
    const check = periodDates.has(ds) ? '<span class="calCheck">✓</span>' : '';
    return `<button type="button" class="${cls.join(' ')}" onclick="selectDate('${ds}')"><span class="${numCls.join(' ')}">${d.getDate()}</span>${check}</button>`;
  }).join('');
  return `
    <div class="calWrap">
      <div class="calNav">
        <button class="calNavBtn" onclick="changePeriod(-1)">‹ 前の期間</button>
        <div class="calTitle">${formatPeriodLabel()}の記録</div>
        <button class="calNavBtn" onclick="changePeriod(1)" ${isCurrentPeriod() ? 'disabled' : ''}>次の期間 ›</button>
      </div>
      <div class="calGrid calHead">${WEEKDAY_LABELS.map((w, i) => `<div class="calHeadCell ${i === 0 ? 'calSun' : i === 6 ? 'calSat' : ''}">${w}</div>`).join('')}</div>
      <div class="calGrid">${cells}</div>
    </div>
  `;
}

function selectDate(ds) {
  selectedDate = ds;
  renderMain();
}

async function init() {
  if (!slug) { renderError('リンクが正しくないようです。管理者に確認してください。'); return; }

  const { data: emp } = await sb.from('employees').select('*').eq('slug', slug).maybeSingle();
  if (!emp) { renderError('あなたの情報が見つかりませんでした。管理者に確認してください。'); return; }
  employee = emp;

  const { data: asg } = await sb
    .from('assignments')
    .select('*, location_schedules(day_of_week, start_time, standard_hours, break_minutes, location_id, locations(name))')
    .eq('employee_id', employee.id);

  myAssignments = (asg || [])
    .filter((a) => a.location_schedules)
    .map((a) => ({
      id: a.id,
      location_id: a.location_schedules.location_id,
      location_name: a.location_schedules.locations?.name ?? '?',
      day_of_week: a.location_schedules.day_of_week,
      start_time: a.location_schedules.start_time,
      standard_hours: a.location_schedules.standard_hours,
      break_minutes: a.location_schedules.break_minutes || 0,
    }));

  if (myAssignments.length === 0) {
    renderError('担当する清掃場所がまだ登録されていません。管理者に確認してください。');
    return;
  }

  setPeriodFromBase();
  selectedDate = todayStr();

  await loadPeriodData();
  renderMain();
}

async function loadRecent() {
  const { data } = await sb
    .from('attendance_records')
    .select('*, locations(name)')
    .eq('employee_id', employee.id)
    .order('date', { ascending: false })
    .limit(10);
  recent = data || [];
}

function renderError(msg) {
  app.innerHTML = `<p class="errorBox">${msg}</p>`;
}

// 場所・時間が同じ担当は、曜日だけ違っても一覧では1項目にまとめる
// (代替要員などで同じ場所・時間の担当を複数曜日ぶん登録することがあるため)
function dedupeAssignments(list) {
  const seen = new Map();
  for (const a of list) {
    const key = `${a.location_id}|${a.start_time}|${a.standard_hours}|${a.break_minutes}`;
    if (!seen.has(key)) seen.set(key, a);
  }
  return [...seen.values()];
}

function renderMain() {
  app.innerHTML = `
    <h1>${employee.name} さん</h1>
    ${renderCalendarHtml()}
    <div id="daySection"></div>
    ${renderHistoryHtml()}
    ${renderReimbursementHtml()}
    ${renderPeriodConfirmHtml()}
  `;
  renderDayForSelected();
}

function renderDayForSelected() {
  const container = document.getElementById('daySection');
  const dow = dowOf(selectedDate);
  const matches = myAssignments.filter((a) => a.day_of_week === dow);
  if (dedupeAssignments(matches).length === 1) {
    selectedAssignment = matches[0];
    renderConfirmInto(container);
  } else {
    renderChoiceInto(container, matches.length > 0 ? matches : null);
  }
}

function renderChoiceInto(container, list) {
  const items = dedupeAssignments(list || myAssignments);
  const showAllLink = !!list && list.length < myAssignments.length;
  const dow = dowOf(selectedDate);
  const isToday = selectedDate === todayStr();
  const header = list
    ? (isToday ? '本日の清掃場所を選んでください' : `${dateLabel(selectedDate)}の清掃場所を選んでください`)
    : '担当場所を選んでください';
  container.innerHTML = `
    <p class="hello">${header}</p>
    <div class="card">
      ${items.map((a) => `<button class="locChoice" onclick="chooseAssignment('${a.id}')">${a.location_name}(${a.day_of_week === dow ? WEEKDAY_LABELS[a.day_of_week] + '曜 ' : ''}${timeRangeLabel(a)})</button>`).join('')}
    </div>
    ${showAllLink ? `<button class="linklike" onclick="renderChoiceInto(document.getElementById('daySection'), myAssignments)">すべての担当から選ぶ</button>` : ''}
  `;
}

function chooseAssignment(id) {
  selectedAssignment = myAssignments.find((a) => a.id === id);
  renderConfirmInto(document.getElementById('daySection'));
}

async function checkExistingForDate(ds, locationId) {
  const { data } = await sb
    .from('attendance_records')
    .select('*')
    .eq('employee_id', employee.id)
    .eq('location_id', locationId)
    .eq('date', ds)
    .maybeSingle();
  return data;
}

async function renderConfirmInto(container) {
  const existing = await checkExistingForDate(selectedDate, selectedAssignment.location_id);
  const isToday = selectedDate === todayStr();
  const dateLbl = isToday ? '本日' : dateLabel(selectedDate);
  if (existing) {
    container.innerHTML = `
      <div class="card">
        <div class="doneIcon">✅</div>
        <div class="doneMsg">${dateLbl}の記録は入力済みです</div>
        <div class="doneSub">${selectedAssignment.location_name} / ${recordDetailLabel(existing, selectedAssignment)}</div>
        ${isPeriodLocked() ? '' : `<button class="linklike" onclick="deleteRecord('${existing.id}')">この記録を取り消す</button>`}
        ${reimbursementSectionHtml()}
      </div>
      ${myAssignments.length > 1 ? `<button class="linklike" onclick="renderChoiceInto(document.getElementById('daySection'), myAssignments)">別の場所を記録する</button>` : ''}
    `;
    return;
  }

  if (isPeriodLocked()) {
    container.innerHTML = `
      <div class="card">
        <div class="doneSub">${dateLbl}は未記録ですが、この期間はすでに確定済みのため記録できません。必要な場合は管理者にご連絡ください。</div>
      </div>
      ${myAssignments.length > 1 ? `<button class="linklike" onclick="renderChoiceInto(document.getElementById('daySection'), myAssignments)">別の場所を記録する</button>` : ''}
    `;
    return;
  }

  container.innerHTML = `
    <div class="card">
      <div class="locName">${selectedAssignment.location_name}</div>
      <div class="locHours">${isToday ? '' : dateLbl + ' ・ '}通常: ${timeRangeLabel(selectedAssignment)}</div>
      <button class="bigbtn" onclick="recordStandard()">出勤しました</button>
      <button class="linklike" id="toggleCorrect" onclick="toggleCorrectForm()">時間が違う場合はこちら</button>
      <div id="correctForm" style="display:none;" class="correctForm">
        <label>開始時刻</label>
        <input id="actualStart" type="time" value="${selectedAssignment.start_time ?? ''}" />
        <label>終了時刻</label>
        <input id="actualEnd" type="time" value="${selectedAssignment.start_time ? computeEndTime(selectedAssignment.start_time, selectedAssignment.standard_hours, selectedAssignment.break_minutes) : ''}" />
        <label>休憩時間(分)</label>
        <input id="actualBreak" type="number" step="1" value="${selectedAssignment.break_minutes || 0}" />
        <label>理由</label>
        <textarea id="reason" rows="2" placeholder="例: ゴミが多かったため延長"></textarea>
        <button class="bigbtn" onclick="recordCorrected()">この内容で記録する</button>
      </div>
      ${reimbursementSectionHtml()}
    </div>
    ${myAssignments.length > 1 ? `<button class="linklike" onclick="renderChoiceInto(document.getElementById('daySection'), myAssignments)">別の場所を記録する</button>` : ''}
  `;
}

function toggleCorrectForm() {
  const el = document.getElementById('correctForm');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function recordStandard() {
  if (blockIfLocked()) return;
  const { error } = await sb.from('attendance_records').insert({
    employee_id: employee.id,
    location_id: selectedAssignment.location_id,
    date: selectedDate,
    hours: selectedAssignment.standard_hours,
    is_standard: true,
  });
  if (error) { alert('記録できませんでした: ' + error.message); return; }
  await afterRecord();
}

async function recordCorrected() {
  if (blockIfLocked()) return;
  const actualStart = document.getElementById('actualStart').value;
  const actualEnd = document.getElementById('actualEnd').value;
  const actualBreak = parseInt(document.getElementById('actualBreak').value, 10) || 0;
  const reason = document.getElementById('reason').value.trim();
  if (!actualStart || !actualEnd) { alert('開始時刻・終了時刻を入力してください'); return; }
  if (!reason) { alert('理由を入力してください'); return; }
  const hours = diffHours(actualStart, actualEnd) - actualBreak / 60;
  if (hours <= 0) { alert('休憩を引いた実働時間が0以下になっています。時刻・休憩時間を見直してください'); return; }
  const { error } = await sb.from('attendance_records').insert({
    employee_id: employee.id,
    location_id: selectedAssignment.location_id,
    date: selectedDate,
    hours,
    is_standard: false,
    reason,
    actual_start_time: actualStart,
    actual_end_time: actualEnd,
    actual_break_minutes: actualBreak,
  });
  if (error) { alert('記録できませんでした: ' + error.message); return; }
  await afterRecord();
}

async function afterRecord() {
  await Promise.all([loadRecent(), loadPeriodDates()]);
  renderMain();
}

async function deleteRecord(id) {
  if (blockIfLocked()) return;
  if (!confirm('この記録を取り消しますか?')) return;
  await sb.from('attendance_records').delete().eq('id', id);
  await afterRecord();
}

async function loadReimbursements() {
  const { data } = await sb
    .from('reimbursements')
    .select('*')
    .eq('employee_id', employee.id)
    .gte('date', dateStr(periodStart))
    .lte('date', dateStr(periodEnd))
    .order('date', { ascending: false });
  reimbursements = data || [];
}

async function loadPeriodConfirmation() {
  const { data } = await sb
    .from('period_confirmations')
    .select('*')
    .eq('employee_id', employee.id)
    .eq('period_end', dateStr(periodEnd))
    .maybeSingle();
  periodConfirmation = data || null;
}

// この期間が確定済みかどうか。確定後は出勤記録・立替金とも変更不可にする
function isPeriodLocked() {
  return !!periodConfirmation;
}

function blockIfLocked() {
  if (!isPeriodLocked()) return false;
  alert('この期間はすでに確定済みのため、変更できません。訂正が必要な場合は管理者にご連絡ください。');
  return true;
}

async function confirmPeriod() {
  const note = document.getElementById('periodNote').value.trim();
  const { error } = await sb.from('period_confirmations').insert({
    employee_id: employee.id,
    period_end: dateStr(periodEnd),
    note: note || null,
  });
  if (error) { alert('確定できませんでした: ' + error.message); return; }
  await loadPeriodConfirmation();
  renderMain();
}

function renderPeriodConfirmHtml() {
  if (periodConfirmation) {
    const when = new Date(periodConfirmation.confirmed_at);
    const whenLabel = `${when.getMonth() + 1}月${when.getDate()}日`;
    return `
      <div class="sectionTitle">期間の確認</div>
      <div class="card">
        <div class="doneSub" style="text-align:left;">✅ ${whenLabel}に確定済みです${periodConfirmation.note ? '<br>メモ: ' + periodConfirmation.note : ''}</div>
      </div>
    `;
  }
  return `
    <div class="sectionTitle">期間の確認</div>
    <div class="card">
      <p class="locHours" style="text-align:left; margin-bottom:10px;">${formatPeriodLabel()}の内容に間違いがなければ確定してください。確定後は内容を変更できなくなります。お知らせしたいことがあれば、メモ欄にご記入ください。</p>
      <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:4px;">メモ(任意)</label>
      <textarea id="periodNote" rows="2" placeholder="例: 来月から火曜はお休みします" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;margin-bottom:10px;background:var(--field);font-family:inherit;"></textarea>
      <button class="bigbtn" onclick="confirmPeriod()">この期間の内容に間違いありません</button>
    </div>
  `;
}

function reimbursementForDate(ds) {
  return reimbursements.find((r) => r.date === ds);
}

function toggleReimbForm() {
  const el = document.getElementById('reimbForm');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function addReimbursementForSelectedDate() {
  if (blockIfLocked()) return;
  const amount = parseInt(document.getElementById('reimbAmount').value, 10);
  const content = document.getElementById('reimbContent').value.trim();
  if (!amount || !content) { alert('金額・内容を入力してください'); return; }
  const { error } = await sb.from('reimbursements').insert({ employee_id: employee.id, date: selectedDate, amount, content });
  if (error) { alert('登録できませんでした: ' + error.message); return; }
  await loadReimbursements();
  renderMain();
}

async function deleteReimbursement(id) {
  if (blockIfLocked()) return;
  if (!confirm('この立替金の記録を取り消しますか?')) return;
  await sb.from('reimbursements').delete().eq('id', id);
  await loadReimbursements();
  renderMain();
}

// 「出勤しました」ボタンの近くに表示する、買い物があった場合だけ開く入力欄。
// 1日1件までを想定し、既に登録済みならその内容と取消リンクを表示する
function reimbursementSectionHtml() {
  const existing = reimbursementForDate(selectedDate);
  if (existing) {
    return `
      <div class="reimbDone">
        立替金登録済み: ${Number(existing.amount).toLocaleString()}円 ・ ${existing.content}
        ${isPeriodLocked() ? '' : `<button class="linklike" onclick="deleteReimbursement('${existing.id}')">取消</button>`}
      </div>
    `;
  }
  if (isPeriodLocked()) return '';
  return `
    <button class="linklike" id="toggleReimb" onclick="toggleReimbForm()">買い物があった場合はこちら</button>
    <div id="reimbForm" style="display:none;" class="correctForm">
      <label>金額(円)</label>
      <input id="reimbAmount" type="number" step="1" min="0" placeholder="例: 500" />
      <label>内容</label>
      <input id="reimbContent" type="text" placeholder="例: 洗剤" />
      <button class="bigbtn" onclick="addReimbursementForSelectedDate()">立替金を登録する</button>
    </div>
  `;
}

function renderReimbursementHtml() {
  if (reimbursements.length === 0) return '';
  const total = reimbursements.reduce((sum, r) => sum + Number(r.amount), 0);
  const rows = reimbursements.map((r) => `
    <div class="histRow">
      <div>
        <div class="histDate">${dateLabel(r.date)}</div>
        <div class="histDetail">${r.content} ・ ${Number(r.amount).toLocaleString()}円</div>
      </div>
      <div class="histActions">
        <button onclick="deleteReimbursement('${r.id}')">取消</button>
      </div>
    </div>
  `).join('');
  return `
    <div class="sectionTitle">立替金(清掃用品などの購入分)</div>
    <div class="card">
      <div class="reimbTotal">今期間の合計: <strong>${total.toLocaleString()}円</strong></div>
      ${rows}
    </div>
  `;
}

function renderHistoryHtml() {
  if (recent.length === 0) return '';
  return `
    <div class="sectionTitle">最近の記録</div>
    <div class="card">
      ${recent.map((r) => {
        const recordDow = new Date(r.date + 'T00:00:00').getDay();
        const asg = myAssignments.find((a) => a.location_id === r.location_id && a.day_of_week === recordDow)
          ?? myAssignments.find((a) => a.location_id === r.location_id);
        const detail = recordDetailLabel(r, asg);
        return `
        <div class="histRow">
          <div>
            <div class="histDate">${r.date}</div>
            <div class="histDetail">${r.locations?.name ?? ''} / ${detail}</div>
          </div>
          <div class="histActions">
            <button onclick="deleteRecord('${r.id}')">取消</button>
          </div>
        </div>
      `;
      }).join('')}
    </div>
  `;
}

init();
</script>
</body>
</html>
