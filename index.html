<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>清掃出勤管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --bg: #F5F0E5;
    --surface: #FFFFFF;
    --border: #E8DDC8;
    --field: #F8F3E8;
    --ink: #3A342E;
    --muted: #6B7A8D;
    --brown: #7c5d48;
    --pink: #F0A8C4;
    --coral: #F7877C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", sans-serif;
    padding: 24px 18px 50px;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 18px; text-align: center; margin: 0 0 4px; color: var(--muted); }
  .hello { font-size: 22px; font-weight: 700; text-align: center; margin: 0 0 24px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .locName { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 4px; }
  .locHours { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  .bigbtn {
    display: block;
    width: 100%;
    background: var(--pink);
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 20px;
    font-size: 19px;
    font-weight: 700;
    cursor: pointer;
  }
  .bigbtn:active { opacity: 0.85; }
  .locChoice {
    display: block;
    width: 100%;
    background: var(--field);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 10px;
    cursor: pointer;
    text-align: left;
  }
  .linklike {
    display: block;
    text-align: center;
    color: var(--brown);
    font-size: 13px;
    margin-top: 14px;
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
  }
  .correctForm { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .correctForm label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
  .correctForm input, .correctForm textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    font-size: 14px;
    margin-bottom: 10px;
    background: var(--field);
  }
  .doneIcon { font-size: 48px; text-align: center; margin-bottom: 8px; }
  .doneMsg { text-align: center; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .doneSub { text-align: center; font-size: 13px; color: var(--muted); }
  .sectionTitle { font-size: 12px; color: var(--muted); font-weight: 600; margin: 24px 0 8px; }
  .histRow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid #F3EFE4; font-size: 13px;
  }
  .histRow:last-child { border-bottom: none; }
  .histDate { color: var(--ink); font-weight: 600; }
  .histDetail { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .histActions button {
    border: none; background: none; font-size: 12px; color: var(--brown); cursor: pointer; margin-left: 8px;
  }
  .errorBox { text-align: center; color: var(--muted); padding: 40px 20px; }
  .calWrap { margin-bottom: 20px; }
  .calTitle { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 10px; font-weight: 600; }
  .calGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .calHead { margin-bottom: 5px; }
  .calHeadCell { text-align: center; font-size: 11px; color: var(--muted); }
  .calCell {
    aspect-ratio: 1; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 10px; border: none; background: var(--field); font-size: 13px; color: var(--ink);
    position: relative; padding: 0; font-family: inherit;
  }
  .calCell.calEmpty { background: transparent; }
  .calCell.calDisabled { color: var(--border); background: transparent; }
  .calCell.calToday:not(.calSelected) { box-shadow: inset 0 0 0 1.5px var(--brown); }
  .calCell.calSelected { background: var(--brown); color: #fff; }
  .calCheck { font-size: 9px; line-height: 1; color: var(--coral); margin-top: 2px; }
  .calCell.calSelected .calCheck { color: #fff; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="errorBox">読み込み中...</p>
</div>

<script src="supabase-config.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const slug = params.get('e');
const app = document.getElementById('app');

let employee = null;
let myAssignments = [];
let selectedAssignment = null;
let recent = [];
let periodStart = null;
let periodEnd = null;
let periodDates = new Set();
let selectedDate = null;

const WEEKDAY_LABELS = ['日', '月', '火', '水', '木', '金', '土'];

function addHours(startTime, hours) {
  const [h, m] = startTime.split(':').map(Number);
  const totalMin = h * 60 + m + Math.round(hours * 60);
  const endH = Math.floor((totalMin % 1440) / 60);
  const endM = totalMin % 60;
  return String(endH).padStart(2, '0') + ':' + String(endM).padStart(2, '0');
}

function computeEndTime(startTime, hours, breakMinutes) {
  return addHours(startTime, hours + (breakMinutes || 0) / 60);
}

function timeRangeLabel(a) {
  if (!a.start_time) return `通常: ${a.standard_hours}時間`;
  const range = `${a.start_time}〜${computeEndTime(a.start_time, a.standard_hours, a.break_minutes)}`;
  return a.break_minutes ? `${range}(休憩${a.break_minutes}分)` : range;
}

function diffHours(startTime, endTime) {
  const [sh, sm] = startTime.split(':').map(Number);
  const [eh, em] = endTime.split(':').map(Number);
  let diffMin = (eh * 60 + em) - (sh * 60 + sm);
  if (diffMin < 0) diffMin += 1440;
  return diffMin / 60;
}

function recordDetailLabel(r, asg) {
  if (r.is_standard) return asg ? timeRangeLabel(asg) : `${r.hours}時間`;
  if (r.actual_start_time && r.actual_end_time) {
    const breakInfo = r.actual_break_minutes ? `、休憩${r.actual_break_minutes}分` : '';
    return `${r.actual_start_time}〜${r.actual_end_time}${breakInfo}(通常と違う: ${r.reason ?? ''})`;
  }
  return `${r.hours}時間(通常と違う: ${r.reason ?? ''})`;
}

function dateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function todayStr() {
  return dateStr(new Date());
}

function dowOf(ds) {
  const [y, m, d] = ds.split('-').map(Number);
  return new Date(y, m - 1, d).getDay();
}

function dateLabel(ds) {
  const [, m, d] = ds.split('-').map(Number);
  return `${m}月${d}日(${WEEKDAY_LABELS[dowOf(ds)]})`;
}

// 20日締めの給与期間(21日〜翌月20日)。今日がその中のどこにいても
// 正しい期間を計算できるよう、日付からではなく基準日から算出する
function payPeriodRange(base) {
  const y = base.getFullYear(), m = base.getMonth(), d = base.getDate();
  if (d >= 21) return { start: new Date(y, m, 21), end: new Date(y, m + 1, 20) };
  return { start: new Date(y, m - 1, 21), end: new Date(y, m, 20) };
}

function formatPeriodLabel() {
  return `${periodStart.getMonth() + 1}月${periodStart.getDate()}日 〜 ${periodEnd.getMonth() + 1}月${periodEnd.getDate()}日`;
}

function buildCalendarDays() {
  const days = [];
  for (let i = 0; i < periodStart.getDay(); i++) days.push(null);
  const cur = new Date(periodStart);
  while (cur <= periodEnd) {
    days.push(new Date(cur));
    cur.setDate(cur.getDate() + 1);
  }
  while (days.length % 7 !== 0) days.push(null);
  return days;
}

async function loadPeriodDates() {
  const { data } = await sb
    .from('attendance_records')
    .select('date')
    .eq('employee_id', employee.id)
    .gte('date', dateStr(periodStart))
    .lte('date', dateStr(periodEnd));
  periodDates = new Set((data || []).map((r) => r.date));
}

function renderCalendarHtml() {
  const todayS = todayStr();
  const cells = buildCalendarDays().map((d) => {
    if (!d) return '<div class="calCell calEmpty"></div>';
    const ds = dateStr(d);
    const isFuture = ds > todayS;
    const cls = ['calCell'];
    if (isFuture) cls.push('calDisabled');
    if (ds === todayS) cls.push('calToday');
    if (ds === selectedDate) cls.push('calSelected');
    if (isFuture) return `<div class="${cls.join(' ')}"><span class="calNum">${d.getDate()}</span></div>`;
    const check = periodDates.has(ds) ? '<span class="calCheck">✓</span>' : '';
    return `<button type="button" class="${cls.join(' ')}" onclick="selectDate('${ds}')"><span class="calNum">${d.getDate()}</span>${check}</button>`;
  }).join('');
  return `
    <div class="calWrap">
      <div class="calTitle">${formatPeriodLabel()}の記録</div>
      <div class="calGrid calHead">${WEEKDAY_LABELS.map((w) => `<div class="calHeadCell">${w}</div>`).join('')}</div>
      <div class="calGrid">${cells}</div>
    </div>
  `;
}

function selectDate(ds) {
  selectedDate = ds;
  renderMain();
}

async function init() {
  if (!slug) { renderError('リンクが正しくないようです。管理者に確認してください。'); return; }

  const { data: emp } = await sb.from('employees').select('*').eq('slug', slug).maybeSingle();
  if (!emp) { renderError('あなたの情報が見つかりませんでした。管理者に確認してください。'); return; }
  employee = emp;

  const { data: asg } = await sb
    .from('assignments')
    .select('*, location_schedules(day_of_week, start_time, standard_hours, break_minutes, location_id, locations(name))')
    .eq('employee_id', employee.id);

  myAssignments = (asg || [])
    .filter((a) => a.location_schedules)
    .map((a) => ({
      id: a.id,
      location_id: a.location_schedules.location_id,
      location_name: a.location_schedules.locations?.name ?? '?',
      day_of_week: a.location_schedules.day_of_week,
      start_time: a.location_schedules.start_time,
      standard_hours: a.location_schedules.standard_hours,
      break_minutes: a.location_schedules.break_minutes || 0,
    }));

  if (myAssignments.length === 0) {
    renderError('担当する清掃場所がまだ登録されていません。管理者に確認してください。');
    return;
  }

  const range = payPeriodRange(new Date());
  periodStart = range.start;
  periodEnd = range.end;
  selectedDate = todayStr();

  await Promise.all([loadRecent(), loadPeriodDates()]);
  renderMain();
}

async function loadRecent() {
  const { data } = await sb
    .from('attendance_records')
    .select('*, locations(name)')
    .eq('employee_id', employee.id)
    .order('date', { ascending: false })
    .limit(10);
  recent = data || [];
}

function renderError(msg) {
  app.innerHTML = `<p class="errorBox">${msg}</p>`;
}

// 場所・時間が同じ担当は、曜日だけ違っても一覧では1項目にまとめる
// (代替要員などで同じ場所・時間の担当を複数曜日ぶん登録することがあるため)
function dedupeAssignments(list) {
  const seen = new Map();
  for (const a of list) {
    const key = `${a.location_id}|${a.start_time}|${a.standard_hours}|${a.break_minutes}`;
    if (!seen.has(key)) seen.set(key, a);
  }
  return [...seen.values()];
}

function renderMain() {
  app.innerHTML = `
    <h1>${employee.name} さん</h1>
    ${renderCalendarHtml()}
    <div id="daySection"></div>
    ${renderHistoryHtml()}
  `;
  renderDayForSelected();
}

function renderDayForSelected() {
  const container = document.getElementById('daySection');
  const dow = dowOf(selectedDate);
  const matches = myAssignments.filter((a) => a.day_of_week === dow);
  if (dedupeAssignments(matches).length === 1) {
    selectedAssignment = matches[0];
    renderConfirmInto(container);
  } else {
    renderChoiceInto(container, matches.length > 0 ? matches : null);
  }
}

function renderChoiceInto(container, list) {
  const items = dedupeAssignments(list || myAssignments);
  const showAllLink = !!list && list.length < myAssignments.length;
  const dow = dowOf(selectedDate);
  const isToday = selectedDate === todayStr();
  const header = list
    ? (isToday ? '本日の清掃場所を選んでください' : `${dateLabel(selectedDate)}の清掃場所を選んでください`)
    : '担当場所を選んでください';
  container.innerHTML = `
    <p class="hello">${header}</p>
    <div class="card">
      ${items.map((a) => `<button class="locChoice" onclick="chooseAssignment('${a.id}')">${a.location_name}(${a.day_of_week === dow ? WEEKDAY_LABELS[a.day_of_week] + '曜 ' : ''}${timeRangeLabel(a)})</button>`).join('')}
    </div>
    ${showAllLink ? `<button class="linklike" onclick="renderChoiceInto(document.getElementById('daySection'), myAssignments)">すべての担当から選ぶ</button>` : ''}
  `;
}

function chooseAssignment(id) {
  selectedAssignment = myAssignments.find((a) => a.id === id);
  renderConfirmInto(document.getElementById('daySection'));
}

async function checkExistingForDate(ds, locationId) {
  const { data } = await sb
    .from('attendance_records')
    .select('*')
    .eq('employee_id', employee.id)
    .eq('location_id', locationId)
    .eq('date', ds)
    .maybeSingle();
  return data;
}

async function renderConfirmInto(container) {
  const existing = await checkExistingForDate(selectedDate, selectedAssignment.location_id);
  const isToday = selectedDate === todayStr();
  const dateLbl = isToday ? '本日' : dateLabel(selectedDate);
  if (existing) {
    container.innerHTML = `
      <div class="card">
        <div class="doneIcon">✅</div>
        <div class="doneMsg">${dateLbl}の記録は入力済みです</div>
        <div class="doneSub">${selectedAssignment.location_name} / ${recordDetailLabel(existing, selectedAssignment)}</div>
        <button class="linklike" onclick="deleteRecord('${existing.id}')">この記録を取り消す</button>
      </div>
      ${myAssignments.length > 1 ? `<button class="linklike" onclick="renderChoiceInto(document.getElementById('daySection'), myAssignments)">別の場所を記録する</button>` : ''}
    `;
    return;
  }

  container.innerHTML = `
    <div class="card">
      <div class="locName">${selectedAssignment.location_name}</div>
      <div class="locHours">${isToday ? '' : dateLbl + ' ・ '}通常: ${timeRangeLabel(selectedAssignment)}</div>
      <button class="bigbtn" onclick="recordStandard()">出勤しました</button>
      <button class="linklike" id="toggleCorrect" onclick="toggleCorrectForm()">時間が違う場合はこちら</button>
      <div id="correctForm" style="display:none;" class="correctForm">
        <label>開始時刻</label>
        <input id="actualStart" type="time" value="${selectedAssignment.start_time ?? ''}" />
        <label>終了時刻</label>
        <input id="actualEnd" type="time" value="${selectedAssignment.start_time ? computeEndTime(selectedAssignment.start_time, selectedAssignment.standard_hours, selectedAssignment.break_minutes) : ''}" />
        <label>休憩時間(分)</label>
        <input id="actualBreak" type="number" step="1" value="${selectedAssignment.break_minutes || 0}" />
        <label>理由</label>
        <textarea id="reason" rows="2" placeholder="例: ゴミが多かったため延長"></textarea>
        <button class="bigbtn" onclick="recordCorrected()">この内容で記録する</button>
      </div>
    </div>
    ${myAssignments.length > 1 ? `<button class="linklike" onclick="renderChoiceInto(document.getElementById('daySection'), myAssignments)">別の場所を記録する</button>` : ''}
  `;
}

function toggleCorrectForm() {
  const el = document.getElementById('correctForm');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function recordStandard() {
  const { error } = await sb.from('attendance_records').insert({
    employee_id: employee.id,
    location_id: selectedAssignment.location_id,
    date: selectedDate,
    hours: selectedAssignment.standard_hours,
    is_standard: true,
  });
  if (error) { alert('記録できませんでした: ' + error.message); return; }
  await afterRecord();
}

async function recordCorrected() {
  const actualStart = document.getElementById('actualStart').value;
  const actualEnd = document.getElementById('actualEnd').value;
  const actualBreak = parseInt(document.getElementById('actualBreak').value, 10) || 0;
  const reason = document.getElementById('reason').value.trim();
  if (!actualStart || !actualEnd) { alert('開始時刻・終了時刻を入力してください'); return; }
  if (!reason) { alert('理由を入力してください'); return; }
  const hours = diffHours(actualStart, actualEnd) - actualBreak / 60;
  if (hours <= 0) { alert('休憩を引いた実働時間が0以下になっています。時刻・休憩時間を見直してください'); return; }
  const { error } = await sb.from('attendance_records').insert({
    employee_id: employee.id,
    location_id: selectedAssignment.location_id,
    date: selectedDate,
    hours,
    is_standard: false,
    reason,
    actual_start_time: actualStart,
    actual_end_time: actualEnd,
    actual_break_minutes: actualBreak,
  });
  if (error) { alert('記録できませんでした: ' + error.message); return; }
  await afterRecord();
}

async function afterRecord() {
  await Promise.all([loadRecent(), loadPeriodDates()]);
  renderMain();
}

async function deleteRecord(id) {
  if (!confirm('この記録を取り消しますか?')) return;
  await sb.from('attendance_records').delete().eq('id', id);
  await afterRecord();
}

function renderHistoryHtml() {
  if (recent.length === 0) return '';
  return `
    <div class="sectionTitle">最近の記録</div>
    <div class="card">
      ${recent.map((r) => {
        const recordDow = new Date(r.date + 'T00:00:00').getDay();
        const asg = myAssignments.find((a) => a.location_id === r.location_id && a.day_of_week === recordDow)
          ?? myAssignments.find((a) => a.location_id === r.location_id);
        const detail = recordDetailLabel(r, asg);
        return `
        <div class="histRow">
          <div>
            <div class="histDate">${r.date}</div>
            <div class="histDetail">${r.locations?.name ?? ''} / ${detail}</div>
          </div>
          <div class="histActions">
            <button onclick="deleteRecord('${r.id}')">取消</button>
          </div>
        </div>
      `;
      }).join('')}
    </div>
  `;
}

init();
</script>
</body>
</html>
